# English Learning project defaults
# These settings apply when this project is trusted and opened in Codex.

# Use the preferred flagship model and deep-reasoning setting for new
# English-conversation chats in this project.
model = "gpt-6.1-sol"
model_reasoning_effort = "xhigh"
model_verbosity = "medium"

# Match Astra's friendly, conversational role defined in AGENTS.md.
personality = "friendly"

# The session rules require current news and changing facts to be verified.
web_search = "live"
