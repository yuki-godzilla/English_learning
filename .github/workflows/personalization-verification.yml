name: Personalization verification

on:
  push:
    branches:
      - codex/personalized-learning-20261012

permissions:
  contents: read

jobs:
  verify:
    runs-on: windows-latest
    timeout-minutes: 25
    permissions:
      contents: write
    defaults:
      run:
        shell: bash
    env:
      VERIFY_BRANCH: codex/personalized-learning-20261012
    steps:
      - name: Check out isolated verification branch
        uses: actions/checkout@v5
        with:
          ref: codex/personalized-learning-20261012
          fetch-depth: 1
      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: npm
      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Verify and apply approved patch
        run: |
          git rev-parse HEAD > "$RUNNER_TEMP/personalization-base.txt"
          python - <<'PY'
          import hashlib, lzma, os, pathlib, subprocess
          data = b''.join(pathlib.Path(f'.github/personalization-patch.{i}').read_bytes() for i in range(3))
          patch = lzma.decompress(data)
          assert hashlib.sha256(patch).hexdigest() == '2212b02fec3add3f043c32b44ff6affdbc36e41059c7b305636c1487fec87cd4'
          target = pathlib.Path(os.environ['RUNNER_TEMP']) / 'personalization.patch'
          target.write_bytes(patch)
          subprocess.run(['git', 'apply', '--check', '--index', str(target)], check=True)
          subprocess.run(['git', 'apply', '--index', str(target)], check=True)
          PY
      - name: Install pinned application dependencies and isolated UI tool
        run: |
          npm ci
          python -m pip install --requirement requirements/site.txt --requirement requirements/pdf.txt
          python -m pip install playwright==1.57.0
          python - <<'PY'
          import os, pathlib, playwright
          with open(os.environ['GITHUB_ENV'], 'a', encoding='utf-8') as f:
              f.write('PLAYWRIGHT_MODULE=' + str(pathlib.Path(playwright.__file__).parent / 'driver' / 'package') + '\n')
          PY
      - name: Regenerate tracked report figures
        run: npm run report:assets
      - name: Validate tests, source, site and print theme
        run: npm run check
      - name: Verify mobile and desktop layouts
        run: npm run ui:check
      - name: Generate and validate the entire Journal PDF
        run: |
          node scripts/export/journal-pdf.mjs
          npm run journal:pdf:check
      - name: Commit verified changes to the isolated branch only
        run: |
          expected=$(cat "$RUNNER_TEMP/personalization-base.txt")
          actual=$(git ls-remote origin "refs/heads/$VERIFY_BRANCH" | cut -f1)
          test "$expected" = "$actual"
          git add learning-records/media-manifest.json learning-records/media/progress/english-growth-evidence-dashboard.png learning-records/media/progress/english-test-score-estimate-trends.png
          git diff --cached --check
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'Implement personalized learning, fair assessment and learning-first reports'
          git push origin "HEAD:refs/heads/$VERIFY_BRANCH"
          git rev-parse HEAD > "$RUNNER_TEMP/personalization-verified-commit.txt"
      - name: Collect verification artifacts without publishing or emailing
        if: always()
        run: |
          python - <<'PY'
          import json, os, pathlib, shutil, subprocess
          temp = pathlib.Path(os.environ['RUNNER_TEMP'])
          out = temp / 'personalization-verification'
          out.mkdir(exist_ok=True)
          marker = temp / 'personalization-verified-commit.txt'
          metadata = {'verified_commit': marker.read_text().strip() if marker.exists() else None, 'visual_review': 'awaiting_assistant_review', 'email_sent': False, 'main_updated': False}
          (out / 'verification.json').write_text(json.dumps(metadata, indent=2), encoding='utf-8')
          subprocess.run(['git', 'archive', '--format=zip', 'HEAD', '--output=' + str(out / 'source.zip')], check=True)
          for src, name in [('output/pdf/yuki-chappy-english-journal.pdf', 'journal.pdf'), ('tmp/journal-failed-candidate.pdf', 'failed-candidate.pdf'), ('tmp/journal-pdf-report.json', 'pdf-report.json')]:
              if pathlib.Path(src).is_file(): shutil.copy2(src, out / name)
          if pathlib.Path('site').is_dir(): shutil.make_archive(str(out / 'site'), 'zip', 'site')
          if pathlib.Path('tmp/browser-qa').is_dir(): shutil.copytree('tmp/browser-qa', out / 'browser-qa', dirs_exist_ok=True)
          if pathlib.Path('tmp/journal-pdf').is_dir(): shutil.make_archive(str(out / 'pdf-debug'), 'zip', 'tmp/journal-pdf')
          PY
      - name: Upload verification files
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: personalization-verification
          path: ${{ runner.temp }}/personalization-verification
          retention-days: 1
          if-no-files-found: error
