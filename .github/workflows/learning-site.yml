name: Learning site

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:
    inputs:
      publish:
        description: Publish the verified site to GitHub Pages
        required: true
        default: false
        type: boolean

permissions:
  contents: read

concurrency:
  group: learning-site-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: read
    steps:
      - name: Check out repository
        uses: actions/checkout@v5

      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements/site.txt

      - name: Install dependencies
        run: |
          npm ci
          python -m pip install --requirement requirements/site.txt

      - name: Audit production Node dependencies
        run: npm audit --omit=dev --audit-level=moderate

      - name: Audit pinned Python dependencies
        run: |
          python -m pip install pip-audit==2.10.1
          python -m pip_audit --requirement requirements/site.txt
          python -m pip_audit --requirement requirements/pdf.txt
          python -m pip_audit --requirement requirements/pronunciation.lock.txt

      - name: Build and validate learning site
        run: npm run check

      - name: Configure GitHub Pages
        if: github.event_name == 'workflow_dispatch' && inputs.publish
        uses: actions/configure-pages@v5

      - name: Upload verified Pages artifact
        if: github.event_name == 'workflow_dispatch' && inputs.publish
        uses: actions/upload-pages-artifact@v4
        with:
          path: site

  pdf-smoke:
    runs-on: windows-latest
    permissions:
      contents: read
    steps:
      - name: Check out repository
        uses: actions/checkout@v5

      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            requirements/site.txt
            requirements/pdf.txt

      - name: Install site and PDF dependencies
        run: |
          npm ci
          python -m pip install --requirement requirements/site.txt --requirement requirements/pdf.txt

      - name: Build and validate source content
        run: npm run check

      - name: Generate and inspect Journal PDF
        run: |
          node scripts/export/journal-pdf.mjs
          npm run journal:pdf:check

  deploy:
    if: github.event_name == 'workflow_dispatch' && inputs.publish
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy verified site to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
